<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wedding Invitation</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3e9df;
    --paper: #fdf8ee;
    --maroon: #7a1a2b;
    --maroon-dark: #5a0f1d;
    --gold: #b8893a;
    --gold-light: #e9cf8a;
    --ink: #3a2a24;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    font-family: 'Noto Serif', Georgia, serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
    overflow-x: hidden;
  }
  .edit-link {
    font-size: 14px;
    color: var(--maroon);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: 0;
    font-family: inherit;
    margin-bottom: 8px;
    z-index: 5;
  }

  /* ---------- stage ---------- */
  .stage {
    position: relative;
    width: min(92vw, 380px);
    aspect-ratio: 3 / 4;
  }

  /* ---------- envelope ---------- */
  .envelope {
    position: absolute; inset: 0;
    border-radius: 14px;
    background: linear-gradient(160deg, #9b2a3d 0%, var(--maroon) 55%, var(--maroon-dark) 100%);
    box-shadow: 0 18px 40px rgba(90, 15, 29, .35);
    overflow: hidden;
    transition: opacity .9s ease, transform .9s ease;
    z-index: 3;
  }
  .envelope::before { /* inner gold border */
    content: ""; position: absolute; inset: 12px;
    border: 1px solid rgba(233, 207, 138, .55);
    border-radius: 8px;
  }
  .ribbon-v, .ribbon-h {
    position: absolute;
    background: linear-gradient(90deg, #c9a24d, var(--gold-light) 45%, #c9a24d);
    box-shadow: 0 0 6px rgba(0,0,0,.25);
  }
  .ribbon-v { top: 0; bottom: 0; left: 50%; width: 44px; transform: translateX(-50%); }
  .ribbon-h {
    left: 0; right: 0; top: 58%; height: 44px; transform: translateY(-50%);
    background: linear-gradient(180deg, #c9a24d, var(--gold-light) 45%, #c9a24d);
  }
  .env-names {
    position: absolute; top: 20px; width: 100%;
    text-align: center; color: var(--gold-light);
    font-size: 21px; letter-spacing: 1px; z-index: 2;
    text-shadow: 0 1px 2px rgba(0,0,0,.4);
  }
  .tap-hint {
    position: absolute; bottom: 24px; width: 100%;
    text-align: center; color: var(--gold-light);
    font-size: 12px; letter-spacing: 4px; z-index: 2;
    animation: pulse 1.8s ease-in-out infinite;
  }
  .seal {
    position: absolute; top: 58%; left: 50%;
    width: 84px; height: 84px; border-radius: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle at 35% 30%, #f6e3a6, #d3a947 60%, #a8782a);
    box-shadow: 0 4px 12px rgba(0,0,0,.4), inset 0 0 0 4px rgba(255,255,255,.25);
    border: 0; cursor: pointer;
    font-size: 40px; line-height: 1;
    display: grid; place-items: center;
    z-index: 4;
    animation: beat 1.6s ease-in-out infinite;
  }
  .seal:active { transform: translate(-50%, -50%) scale(.92); }
  @keyframes beat  { 0%,100% { scale: 1; } 50% { scale: 1.07; } }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }

  /* ---------- card ---------- */
  .card {
    position: absolute; inset: 0;
    background: var(--paper);
    border: 2px solid var(--gold);
    border-radius: 12px;
    box-shadow: 0 12px 30px rgba(0,0,0,.12);
    display: flex; flex-direction: column; align-items: center;
    padding: 26px 20px;
    text-align: center;
    opacity: 0;
    z-index: 1;
  }
  .line { opacity: 0; transform: translateY(10px); }
  .opened .line { animation: rise .8s ease forwards; }
  .opened .line:nth-child(1) { animation-delay: .6s; }
  .opened .line:nth-child(2) { animation-delay: .9s; }
  .opened .line:nth-child(3) { animation-delay: 1.1s; }
  .opened .line:nth-child(4) { animation-delay: 1.3s; }
  .opened .line:nth-child(5) { animation-delay: 1.5s; }
  .opened .line:nth-child(6) { animation-delay: 1.7s; }
  .opened .line:nth-child(7) { animation-delay: 1.9s; }
  .opened .line:nth-child(8) { animation-delay: 2.1s; }
  .opened .line:nth-child(9) { animation-delay: 2.3s; }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .opened .envelope { opacity: 0; transform: scale(1.08); pointer-events: none; }
  .opened .card { opacity: 1; z-index: 2; transition: opacity .9s ease .3s; }

  .invited { font-size: 11px; letter-spacing: 3px; color: var(--gold); text-transform: uppercase; line-height: 1.6; }
  .name { font-size: 38px; font-weight: 500; color: var(--maroon); line-height: 1.15; margin-top: 8px; }
  .amp  { font-size: 26px; color: var(--gold); margin-top: 6px; }
  .rule { width: 56px; height: 2px; background: var(--gold); margin: 16px 0; }
  .date { font-size: 20px; font-weight: 500; }
  .time { font-size: 15px; margin-top: 2px; }
  .venue { font-size: 17px; }
  .msg { font-style: italic; font-size: 16px; line-height: 1.6; margin-top: 18px; }

  /* ---------- petals ---------- */
  .petal {
    position: fixed; top: -30px;
    width: 14px; height: 18px;
    background: radial-gradient(circle at 30% 30%, #f9b8c4, #e8738a);
    border-radius: 80% 0 80% 0;
    pointer-events: none; z-index: 20;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); opacity: .7; }
  }

  /* ---------- editor ---------- */
  dialog {
    border: 0; border-radius: 14px; padding: 20px;
    width: min(92vw, 360px);
    font-family: inherit;
    box-shadow: 0 20px 50px rgba(0,0,0,.3);
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h3 { color: var(--maroon); margin-bottom: 12px; font-weight: 500; }
  dialog label { display: block; font-size: 12px; margin: 10px 0 3px; color: #6b5a52; }
  dialog input, dialog textarea {
    width: 100%; padding: 9px 10px; font: inherit; font-size: 14px;
    border: 1px solid #d8c9b8; border-radius: 8px; background: #fffdf8;
  }
  .row { display: flex; gap: 8px; margin-top: 16px; }
  .btn {
    flex: 1; padding: 10px; border-radius: 8px; border: 0; cursor: pointer;
    font: inherit; font-size: 14px; background: var(--maroon); color: #fff;
  }
  .btn.alt { background: #eadfd2; color: var(--ink); }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #2a1a17; color: #fff; padding: 10px 16px; border-radius: 20px;
    font-size: 13px; opacity: 0; transition: opacity .3s; z-index: 50; pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<button class="edit-link" id="editBtn">✏️ Edit details &amp; get share link</button>

<div class="stage" id="stage">
  <!-- Card (revealed after tap) -->
  <div class="card">
    <div class="line invited">You are invited to the<br>wedding of</div>
    <div class="line name" id="n1">Salander</div>
    <div class="line amp">&amp;</div>
    <div class="line name" id="n2">Kajal</div>
    <div class="line rule"></div>
    <div class="line"><div class="date" id="date">Saturday, 14 November 2026</div><div class="time" id="time">at 5:00 PM</div></div>
    <div class="line rule"></div>
    <div class="line venue" id="venue">Bassi Banada (Bonda Bhojpuriya)</div>
    <div class="line msg" id="msg">Together with our families, we joyfully invite you to celebrate our wedding.</div>
  </div>

  <!-- Envelope (tap the rose) -->
  <div class="envelope">
    <div class="env-names" id="envNames">Salander &amp; Kajal</div>
    <div class="ribbon-v"></div>
    <div class="ribbon-h"></div>
    <button class="seal" id="seal" aria-label="Open invitation">🌹</button>
    <div class="tap-hint">TAP THE ROSE</div>
  </div>
</div>

<dialog id="dlg">
  <h3>Edit details</h3>
  <label>Name 1</label><input id="i_n1">
  <label>Name 2</label><input id="i_n2">
  <label>Date</label><input id="i_date">
  <label>Time</label><input id="i_time">
  <label>Venue</label><input id="i_venue">
  <label>Message</label><textarea id="i_msg" rows="3"></textarea>
  <div class="row">
    <button class="btn alt" id="cancel">Cancel</button>
    <button class="btn" id="copy">Copy share link</button>
  </div>
</dialog>

<div class="toast" id="toast">Link copied!</div>

<script>
  const $ = id => document.getElementById(id);
  const defaults = {
    n1: 'Salander', n2: 'Kajal',
    date: 'Saturday, 14 November 2026', time: 'at 5:00 PM',
    venue: 'Bassi Banada (Bonda Bhojpuriya)',
    msg: 'Together with our families, we joyfully invite you to celebrate our wedding.'
  };

  // Read details from the URL (?n1=...&n2=...), fall back to defaults
  const params = new URLSearchParams(location.search);
  const data = {};
  for (const k in defaults) data[k] = params.get(k) || defaults[k];

  function render() {
    $('n1').textContent = data.n1;
    $('n2').textContent = data.n2;
    $('date').textContent = data.date;
    $('time').textContent = data.time;
    $('venue').textContent = data.venue;
    $('msg').textContent = data.msg;
    $('envNames').textContent = data.n1 + ' & ' + data.n2;
    document.title = data.n1 + ' & ' + data.n2 + ' – Wedding Invitation';
  }
  render();

  // ---- Open the invitation ----
  function makePetals(count = 60) {
    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'petal';
      p.style.left = Math.random() * 100 + 'vw';
      p.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px');
      p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDuration = (3 + Math.random() * 3) + 's';
      p.style.animationDelay = (Math.random() * 1.2) + 's';
      p.style.scale = (0.7 + Math.random() * 0.9);
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 8000);
    }
  }
  $('seal').addEventListener('click', () => {
    $('stage').classList.add('opened');
    makePetals();
  });

  // ---- Editor + share link ----
  const dlg = $('dlg');
  $('editBtn').onclick = () => {
    for (const k in data) $('i_' + k).value = data[k];
    dlg.showModal();
  };
  $('cancel').onclick = () => dlg.close();
  $('copy').onclick = async () => {
    for (const k in data) data[k] = $('i_' + k).value.trim() || defaults[k];
    render();
    const q = new URLSearchParams(data).toString();
    const url = location.origin + location.pathname + '?' + q;
    try { await navigator.clipboard.writeText(url); } catch (e) { prompt('Copy this link:', url); }
    dlg.close();
    const t = $('toast'); t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
  };
</script>
</body>
</html>
